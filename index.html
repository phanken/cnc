<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quy đổi KG → PCS</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f3f6fb;
      color:#172033;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .card{
      width:100%;
      max-width:560px;
      background:#fff;
      border-radius:20px;
      box-shadow:0 12px 40px rgba(0,0,0,.08);
      padding:26px;
    }
    h1{margin:0 0 8px;font-size:28px}
    .sub{margin:0 0 24px;color:#667085;line-height:1.5}
    .grid{display:grid;gap:16px}
    .field{
      padding:16px;
      border:1px solid #e2e7ef;
      border-radius:16px;
      background:#fafbfe;
    }
    label{display:block;font-weight:700;margin-bottom:8px}
    input,select{
      width:100%;
      border:1px solid #d8dee9;
      border-radius:12px;
      padding:14px 15px;
      font-size:19px;
      outline:none;
      background:#fff;
    }
    input:focus,select:focus{
      border-color:#6b7cff;
      box-shadow:0 0 0 3px rgba(107,124,255,.12)
    }
    .unit{
      margin-top:7px;
      font-size:13px;
      color:#7a8497;
    }
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
    button{
      border:0;
      border-radius:12px;
      padding:13px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }
    .primary{background:#172033;color:#fff}
    .secondary{background:#eef1f7;color:#172033}
    .formula{
      margin-top:16px;
      font-size:14px;
      padding:12px;
      border-radius:10px;
      background:#f6f8ff;
      color:#566074;
      line-height:1.5;
    }
    @media(max-width:480px){
      .card{padding:18px}
      h1{font-size:24px}
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Quy đổi KG → PCS</h1>
    <p class="sub">Nhập KG, số PCS trên 1 KG hoặc tổng PCS. Cả 3 ô đều có thể nhập.</p>


    <div class="grid">
      <div class="field">
        <label for="kg">Số KG</label>
        <input id="kg" type="number" min="0" step="any" inputmode="decimal" placeholder="Nhập số KG">
        <div class="unit">Có thể nhập trực tiếp</div>
      </div>

      <div class="field">
        <label for="rate">Số PCS trên 1 KG</label>
        <input id="rate" type="number" min="0" step="any" inputmode="decimal" placeholder="Nhập hệ số quy đổi">
        <div class="unit">Ví dụ: 1 KG = 4 PCS</div>
      </div>

      <div class="field">
        <label for="pcs">Số PCS</label>
        <input id="pcs" type="number" min="0" step="any" inputmode="decimal" placeholder="Nhập số PCS">
        <div class="unit">Có thể nhập trực tiếp</div>
      </div>
    </div>

    <div class="buttons">
      <button class="primary" id="roundBtn">Làm tròn PCS</button>
      <button class="secondary" id="resetBtn">Nhập lại</button>
    </div>

    <div class="formula" id="formula">
      Nhập KG + hệ số → tính PCS<br>
      Nhập PCS + hệ số → tính KG<br>
      Nhập KG + PCS → tính hệ số
    </div>
  </main>

<script>
  const kg = document.getElementById('kg');
  const rate = document.getElementById('rate');
  const pcs = document.getElementById('pcs');

  let internalUpdate = false;
  let lastUserField = null;

  function num(el){
    const v = parseFloat(el.value);
    return Number.isFinite(v) ? v : null;
  }

  function setVal(el, value, decimals = 6){
    if (!Number.isFinite(value)) return;
    internalUpdate = true;
    el.value = Number(value.toFixed(decimals)).toString();
    internalUpdate = false;
  }

  function calculate(currentField){
    if (internalUpdate) return;

    const k = num(kg);
    const r = num(rate);
    const p = num(pcs);

    // Dùng 2 ô người dùng vừa sửa gần nhất để tính ô còn lại.
    const pair = new Set([lastUserField, currentField]);

    if (pair.has('kg') && pair.has('pcs')) {
      // KG + PCS => hệ số PCS/KG
      if (k !== null && k > 0 && p !== null) {
        setVal(rate, p / k);
      }
    } else if (pair.has('kg') && pair.has('rate')) {
      // KG + hệ số => tổng PCS
      if (k !== null && r !== null && r >= 0) {
        setVal(pcs, k * r);
      }
    } else if (pair.has('pcs') && pair.has('rate')) {
      // PCS + hệ số => KG
      if (p !== null && r !== null && r > 0) {
        setVal(kg, p / r);
      }
    } else {
      // Khi mới nhập ô đầu tiên, nếu đã có một ô khác thì tính theo cặp hợp lý.
      if (currentField === 'kg') {
        if (p !== null && k !== null && k > 0) setVal(rate, p / k);
        else if (r !== null && k !== null) setVal(pcs, k * r);
      } else if (currentField === 'pcs') {
        if (k !== null && k > 0 && p !== null) setVal(rate, p / k);
        else if (r !== null && r > 0 && p !== null) setVal(kg, p / r);
      } else if (currentField === 'rate') {
        if (k !== null && r !== null) setVal(pcs, k * r);
        else if (p !== null && r !== null && r > 0) setVal(kg, p / r);
      }
    }

    lastUserField = currentField;
  }

  ['kg','rate','pcs'].forEach(id=>{
    const el = document.getElementById(id);

    el.addEventListener('focus', ()=>{
      // Không đổi lastUserField ở đây để vẫn biết ô nào vừa được sửa trước đó.
    });

    el.addEventListener('input', ()=>{
      calculate(id);
    });
  });

  document.getElementById('roundBtn').addEventListener('click', ()=>{
    const p = num(pcs);
    if (p !== null){
      internalUpdate = true;
      pcs.value = Math.round(p);
      internalUpdate = false;

      // Sau khi làm tròn PCS, ưu tiên tính lại hệ số nếu KG đang có.
      const k = num(kg);
      if (k !== null && k > 0) {
        setVal(rate, Math.round(p) / k);
      } else {
        const r = num(rate);
        if (r !== null && r > 0) setVal(kg, Math.round(p) / r);
      }

      lastUserField = 'pcs';
    }
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    internalUpdate = true;
    kg.value = '';
    rate.value = '';
    pcs.value = '';
    internalUpdate = false;
    lastUserField = null;
    kg.focus();
  });
</script>
</body>
</html>
